[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory"
version = "0.1.0"
description = "Local cross-tool project working memory: CLI + stdio MCP, pure standard library, no network ports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["memory", "mcp", "handoff", "agent-tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
project-memory = "project_memory.cli:main"

[tool.setuptools]
packages = ["project_memory"]
